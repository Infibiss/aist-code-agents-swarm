[project]
name = "aist-swarm"
version = "0.0.1"
description = "Fit and run swarms of small local language models for bug fixing under a hardware budget"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiohttp>=3.10",
    "fedotmas",
    "httpx>=0.27",
    "mini-swe-agent>=2.4",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
aist-swarm = "aist_swarm.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aist_swarm"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
fedotmas = { git = "https://github.com/ITMO-NSS-team/FEDOT.Swarm", subdirectory = "packages/fedotmas" }
